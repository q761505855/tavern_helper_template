            <details class="wrap" open>
              <summary class="head"><div class="dot"></div><span class="title">Awaiting Input</span></summary>
              <div class="body" id="ol"></div>
            </details>
            <div id="rd" style="display:none;">$1</div>
            <script>
            // 防转义核心：拆分尖括号，规避ST明文转义
            const lt = String.fromCharCode(60);
            const gt = String.fromCharCode(62);

            document.addEventListener('DOMContentLoaded',function(){
            function syncT(){
            try{
            var p=window.parent.document;
            var el=p.querySelector('.mes_text')||p.body;
            var c=window.parent.getComputedStyle(el).color;
            var m=c.match(/\d+/g);
            if(m){
            if((parseInt(m[0])*299+parseInt(m[1])*587+parseInt(m[2])*114)/1000<128)
            document.body.classList.add('lt');
            else
            document.body.classList.remove('lt')
            }}catch(e){}}
            syncT();
            setInterval(syncT,500);
            try{
            var pDoc=window.parent.document;
            var mesText=pDoc.querySelector('.mes_text')||pDoc.body;
            var syncStyle=function(){
            document.body.style.fontFamily=window.parent.getComputedStyle(mesText).fontFamily
            };
            syncStyle();
            new MutationObserver(syncStyle).observe(pDoc.body,{attributes:true,attributeFilter:['data-theme','style','class']})
            }catch(e){}
            function H(){
            try{
            var f=window.frameElement;
            if(f)f.style.height=document.body.scrollHeight+'px'
            }catch(e){}}
            new ResizeObserver(H).observe(document.body);
            setTimeout(H,100);
            document.querySelector('details').addEventListener('toggle',function(){setTimeout(H,50)});
            var d=document.getElementById('rd'),l=document.getElementById('ol');
            if(!d||!l)return;
            var rawHtml=d.innerHTML;
            var cleanStr=rawHtml.replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<\/li>/gi,'\n');
            var tempDiv=document.createElement('div');
            tempDiv.innerHTML=cleanStr;
            var pureText=tempDiv.textContent||tempDiv.innerText;
            var lines=pureText.trim().split(/\r?\n/).filter(function(x){return x.trim()});
            lines.forEach(function(line,idx){
            var text=line.trim().replace(/^([0-9]+[.\-、)]|[A-Z][.\-、)]|\-|\*)\s*/i,'');
            if(!text)return;
            var item=document.createElement('div');
            item.className='option-item';
            item.style.animationDelay=(idx*0.08)+'s';
            // 关键：所有拼接HTML 用变量拆分尖括号，杜绝明文<>
            item.innerHTML=
            lt+'div class="spotlight-border"'+gt+
            lt+'/div'+gt+
            lt+'div class="spotlight-inner"'+gt+
            lt+'/div'+gt+
            lt+'div class="option-content"'+gt+
              lt+'div class="option-left"'+gt+
                lt+'div class="option-index"'+gt+(idx+1)+lt+'/div'+gt+
                lt+'div class="option-text"'+gt+text+lt+'/div'+gt+
              lt+'/div'+gt+
              lt+'svg class="option-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'+gt+
                lt+'line x1="5" y1="12" x2="19" y2="12"'+gt+lt+'/line'+gt+
                lt+'polyline points="12 5 19 12 12 19"'+gt+lt+'/polyline'+gt+
              lt+'/svg'+gt+
            lt+'/div'+gt;

            item.addEventListener('mousemove',function(e){
            var rect=item.getBoundingClientRect();
            var x=e.clientX-rect.left;
            var y=e.clientY-rect.top;
            var lt=document.body.classList.contains('lt');
            var bc=lt?'rgba(0,0,0,.06)':'rgba(255,255,255,.12)';
            var ic=lt?'rgba(56,189,248,.12)':'rgba(56,189,248,.1)';
            item.querySelector('.spotlight-border').style.background='radial-gradient(600px circle at '+x+'px '+y+'px,'+bc+',transparent 40%)';
            item.querySelector('.spotlight-inner').style.background='radial-gradient(400px circle at '+x+'px '+y+'px,'+ic+',transparent 40%)'});
            item.addEventListener('mouseleave',function(){
            item.querySelector('.spotlight-border').style.background='';
            item.querySelector('.spotlight-inner').style.background=''});
            item.addEventListener('click',function(){
            try{
            var inp=window.parent.document.querySelector('#send_textarea');
            var tr=window.parent.triggerSlash;
            if(inp){
            inp.value+=text;
            inp.dispatchEvent(new Event('input',{bubbles:true}));
            inp.focus()
            }else if(tr){
            tr('/setinput '+text)
            }}catch(e){}});
            l.appendChild(item)});
            });
            </script></body></html>
