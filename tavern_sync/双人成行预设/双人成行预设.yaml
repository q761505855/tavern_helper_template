            .prism-wrapper .gi{pointer-events:none;position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .3s;z-index:0;background:radial-gradient(300px circle at var(--mouse-x) var(--mouse-y),rgba(56,189,248,.15),transparent 40%);}
