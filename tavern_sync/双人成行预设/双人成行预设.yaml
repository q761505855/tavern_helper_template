            *{margin:0;padding:0;box-sizing:border-box}body{padding:8px 12px;margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}.wrap{border-radius:16px;border:1px solid rgba(150,150,150,.15);background:rgba(127,127,127,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 32px rgba(0,0,0,.15);margin:8px 0;transition:all .4s ease;width:100%;max-width:720px;color:rgba(255,255,255,.9)}.wrap:hover{border-color:rgba(56,189,248,.3);box-shadow:0 10px 40px rgba(0,0,0,.2)}.head{display:flex;align-items:center;gap:10px;padding:14px 20px;cursor:pointer;user-select:none;list-style:none;outline:none}.head::-webkit-details-marker{display:none}details[open].wrap > .head{border-bottom:1px solid rgba(150,150,150,.1)}.dot{width:8px;height:8px;border-radius:50%;background:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.8);animation:pulse 2s infinite;flex-shrink:0}details[open].wrap .dot{animation:none;box-shadow:0 0 4px rgba(56,189,248,.5)}.title{font-size:11px;font-family:Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(56,189,248,.85)}.body{padding:16px;display:flex;flex-direction:column;gap:12px}.option-item{position:relative;width:100%;text-align:left;padding:16px 20px;border-radius:14px;overflow:hidden;border:1px solid rgba(150,150,150,.15);background:rgba(127,127,127,.05);cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;opacity:0;transform:translateY(15px);animation:flyIn .5s forwards;transition:all .3s ease}.option-item:hover{border-color:rgba(56,189,248,.4);transform:scale(1.01);box-shadow:0 8px 24px rgba(0,0,0,.15)}.option-item:active{transform:scale(.98)}.spotlight-border{pointer-events:none;position:absolute;inset:-1px;border-radius:14px;opacity:0;transition:opacity .3s}.spotlight-inner{pointer-events:none;position:absolute;inset:0;border-radius:14px;opacity:0;transition:opacity .3s}.option-item:hover .spotlight-border,.option-item:hover .spotlight-inner{opacity:1}.option-content{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px}.option-left{display:flex;align-items:center;gap:16px;min-width:0}.option-index{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(150,150,150,.1);border:1px solid rgba(150,150,150,.2);color:rgba(150,150,150,.8);font-size:12px;font-family:Consolas,monospace;flex-shrink:0;transition:all .3s}.option-item:hover .option-index{color:#38bdf8;border-color:rgba(56,189,248,.6);background:rgba(56,189,248,.1)}.option-text{color:inherit;font-size:14px;line-height:1.5;list-style:none}.option-arrow{flex-shrink:0;width:18px;height:18px;color:#38bdf8;opacity:0;transform:translateX(-10px);transition:all .3s}.option-item:hover .option-arrow{opacity:1;transform:translateX(0)}body.lt .wrap{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08);box-shadow:0 4px 16px rgba(0,0,0,.05);color:rgba(0,0,0,.85)}body.lt .head{border-bottom-color:rgba(0,0,0,.08)}body.lt .option-item{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.08)}body.lt .option-item:hover{border-color:rgba(14,165,233,.4);background:rgba(14,165,233,.05)}body.lt .option-text{color:rgba(0,0,0,.85)}@keyframes flyIn{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 10px rgba(56,189,248,.8)}50%{opacity:.4;box-shadow:0 0 4px rgba(56,189,248,.3)}}
