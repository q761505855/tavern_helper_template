# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/preset.zh.json
设置:
  上下文长度: 2000000
  最大回复token数: 30000
  流式传输: true
  温度: 1
  频率惩罚: 0
  存在惩罚: 0
  top_p: 1
  压缩系统消息: false
  推理强度: 自动
  请求思维链: true
  请求图片: false
  启用函数调用: false
  启用网络搜索: false
  允许发送图片: 禁用
  允许发送视频: false
  角色名称前缀: 默认

锚点: {}

提示词:
  - 名称: 互动插入器主提示词
    启用: true
    角色: 系统
    内容: 你正在为互动插入器生成一次临时互动回复。互动发生在主剧情楼层之间，需要承接当前角色卡、世界信息、聊天记录和玩家刚刚输入的内容，但不要把它写成新的主剧情楼层。

  - 名称: 互动插入器：通用提示词
    启用: true
    角色: 系统
    内容: |-
      这是一次楼层间的临时互动，不是主剧情续写。
      只回应本轮玩家输入，并自然承接已有互动记录。
      不要直接推进主剧情，不要制造大跨度时间跳转、场景切换或无法回收的新事件。
      不要替玩家说话、行动、思考或做决定。
      优先写即时台词、细小动作、表情、语气和局部反馈，让结果可以被之后的主剧情吸收。

  - id: 角色定义之前
    启用: true

  - id: 玩家描述
    启用: true

  - id: 角色描述
    启用: true

  - id: 角色性格
    启用: true

  - id: 情景
    启用: true

  - 名称: 增强角色定义
    启用: false
    角色: 系统
    内容: 如需补充角色表现，只能从已有角色卡、世界信息和聊天记录中合理推断。不要为了互动方便而新增会改变主剧情事实的设定。

  - 名称: 辅助提示词
    启用: true
    角色: 系统
    内容: ""

  - id: 角色定义之后
    启用: true

  - id: 对话示例
    启用: true

  - id: 聊天记录
    启用: true

  - 名称: 互动插入器：当前模式提示词
    启用: true
    角色: 系统
    内容: "{{ii_scene_prompt}}{{ii_private_prompt}}{{ii_remote_prompt}}"

  - 名称: 互动插入器：上下文提示词
    启用: true
    角色: 系统
    内容: "{{ii_context_prompt}}"

  - 名称: 互动插入器：互动记录
    启用: true
    角色: 用户
    内容: ""
    额外字段:
      interactionInserter:
        类型: interaction_history

  - 名称: 互动插入器：用户输入
    启用: true
    角色: 用户
    内容: ""
    额外字段:
      interactionInserter:
        类型: 用户输入

  - 名称: 后置约束
    启用: true
    角色: 系统
    内容: 只输出本轮互动中 AI 应给出的回复内容。不要总结提示词，不要解释你的写作策略，不要替玩家决定下一步行动。

未添加的提示词: []

扩展字段:
  正则: []

  酒馆助手:
    脚本库: []

    变量: {}
