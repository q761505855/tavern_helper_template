# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/preset.zh.json
设置:
  上下文长度: 2000000
  最大回复token数: 30000
  流式传输: true
  温度: 1
  频率惩罚: 0
  存在惩罚: 0
  top_p: 0.95
  压缩系统消息: false
  推理强度: 低
  请求思维链: true
  请求图片: false
  启用函数调用: false
  启用网络搜索: false
  允许发送图片: 禁用
  允许发送视频: false
  角色名称前缀: 默认

锚点: {}

提示词:
  - 名称: 📑使用说明
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\📑使用说明

  - 名称: ✅互动插入器核心规则
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\✅互动插入器核心规则

  - 名称: 🎯角色表达依据
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\😀人格补充

  - 名称: ⚡即时回应逻辑
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\😀情感基准

  - 名称: 🗣输出格式
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🗣输出格式

  - 名称: 🧭旁白人称：跟随主剧情
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🧭旁白人称：跟随主剧情

  - 名称: 🕐旁白人称：第一人称
    启用: false
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🕐旁白人称：第一人称

  - 名称: 🕑旁白人称：第二人称
    启用: false
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🕑旁白人称：第二人称

  - 名称: 🕒旁白人称：第三人称
    启用: false
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🕒旁白人称：第三人称

  - 名称: 🧭旁白人称设定
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🧭旁白人称设定

  - 名称: 🧭人称与控制权
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🧭人称与控制权

  - 名称: 💬对白质感
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\💬对白质感

  - 名称: 🎭非对白描写
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🎭动作表情控制

  - 名称: 🧠角色心理开关
    启用: false
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🧠角色心理开关

  - 名称: 🧩模式协同规则
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🧩模式协同规则

  - 名称: 📚Gemini 3 Flash 正确示例
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\📚正确示例

  - id: 角色定义之前
    启用: true

  - id: 玩家描述
    启用: true

  - id: 角色描述
    启用: true

  - id: 角色性格
    启用: true

  - id: 情景
    启用: true

  - 名称: 增强角色定义
    启用: false
    插入位置:
      类型: 相对
    角色: 系统
    内容: |-
      增强角色定义:
        - 如需补充角色表现，只能从已有角色卡、世界信息和聊天记录中合理推断。
        - 不要为了互动方便而新增会改变主剧情事实的设定。
        - 不要让角色为了配合互动而失去原本人设、关系边界或知识边界。

  - 名称: 辅助提示词
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    内容: ""

  - id: 角色定义之后
    启用: true

  - id: 对话示例
    启用: true

  - id: 聊天记录
    启用: true

  - 名称: 互动插入器：当前模式提示词
    启用: true
    角色: 系统
    内容: "{{ii_scene_prompt}}{{ii_private_prompt}}{{ii_remote_prompt}}"

  - 名称: 互动插入器：上下文提示词
    启用: true
    角色: 系统
    内容: "{{ii_context_prompt}}"

  - 名称: 互动插入器：互动记录
    启用: true
    角色: 用户
    内容: ""
    额外字段:
      interactionInserter:
        类型: interaction_history

  - 名称: 🧠生成前检查
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🧠生成前检查

  - 名称: 🛑后置约束
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    文件: 条目\🛑后置约束

  - 名称: 互动插入器：用户输入
    启用: true
    角色: 用户
    内容: ""
    额外字段:
      interactionInserter:
        类型: 用户输入

未添加的提示词: []

