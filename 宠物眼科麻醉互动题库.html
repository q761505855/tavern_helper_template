<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>宠物眼科麻醉互动题库</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f7f9fc;
      --text: #172033;
      --muted: #657084;
      --line: #d9e0e8;
      --primary: #244a7c;
      --primary-2: #1d3d68;
      --primary-soft: #eaf1f9;
      --good: #19724b;
      --good-soft: #e6f5ed;
      --bad: #b23a3a;
      --bad-soft: #fdecec;
      --warn: #9a6812;
      --warn-soft: #fff4d9;
      --shadow: 0 12px 30px rgba(24, 42, 70, .09);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(36, 74, 124, .28);
      outline-offset: 2px;
    }
    .app { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 4px; font-size: clamp(24px, 3vw, 34px); line-height: 1.25; }
    .subtitle { margin: 0; color: var(--muted); }
    .score-box {
      flex: 0 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 14px;
      text-align: right;
      box-shadow: 0 4px 14px rgba(24, 42, 70, .05);
    }
    .score-box strong { display: block; font-size: 20px; color: var(--primary); }
    .score-box span { color: var(--muted); font-size: 13px; }
    .progress-wrap { margin-bottom: 18px; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
    .progress { height: 8px; background: #dfe5ec; border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; width: 0; background: var(--primary); transition: width .25s ease; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .tab {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 16px;
      min-height: 42px;
    }
    .tab[aria-selected="true"] { background: var(--primary); color: white; border-color: var(--primary); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .question-card { padding: clamp(20px, 4vw, 34px); min-height: 520px; }
    .question-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .badge { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 10px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 13px; font-weight: 700; }
    .question-count { color: var(--muted); font-size: 14px; }
    .question-title { margin: 0 0 22px; font-size: clamp(19px, 2.5vw, 24px); line-height: 1.55; }
    .options { display: grid; gap: 11px; margin-bottom: 20px; }
    .option {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      transition: border-color .15s ease, background .15s ease;
    }
    .option:hover { border-color: #a8b8ca; }
    .option:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
    .option input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--primary); }
    .option-letter { color: var(--primary); font-weight: 700; min-width: 22px; }
    .answer-input, .scenario-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      padding: 13px 14px;
    }
    .scenario-input { min-height: 190px; resize: vertical; }
    .answer-label { display: block; font-weight: 700; margin-bottom: 8px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .btn {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 15px;
      font-weight: 700;
    }
    .btn:hover { background: var(--surface-2); }
    .btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-ghost { margin-left: auto; color: var(--muted); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .result { margin-top: 18px; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
    .result.correct { background: var(--good-soft); color: var(--good); }
    .result.wrong { background: var(--bad-soft); color: var(--bad); }
    .result.saved { background: var(--primary-soft); color: var(--primary); }
    .explanation { margin-top: 14px; padding: 16px 18px; border-left: 4px solid var(--primary); background: var(--primary-soft); border-radius: 0 10px 10px 0; }
    .explanation h3 { margin: 0 0 7px; font-size: 17px; }
    .explanation p { margin: 0; }
    .explanation ul { margin: 8px 0 0; padding-left: 1.4em; }
    .explanation li + li { margin-top: 6px; }
    .side { padding: 18px; position: sticky; top: 18px; }
    .side-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .side h2 { margin: 0; font-size: 17px; }
    .reset { border: 0; background: transparent; color: var(--muted); padding: 4px; }
    .reset:hover { color: var(--bad); }
    .question-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .q-jump {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text);
      font-weight: 700;
    }
    .q-jump.current { box-shadow: 0 0 0 3px rgba(36, 74, 124, .22); border-color: var(--primary); }
    .q-jump.answered { background: var(--warn-soft); color: var(--warn); border-color: #efd699; }
    .q-jump.correct { background: var(--good-soft); color: var(--good); border-color: #a8d6bf; }
    .q-jump.wrong { background: var(--bad-soft); color: var(--bad); border-color: #efbcbc; }
    .q-jump.saved { background: var(--primary-soft); color: var(--primary); border-color: #b9cce3; }
    .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; color: var(--muted); font-size: 12px; margin-top: 14px; }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
    .dot.good { background: var(--good); }
    .dot.bad { background: var(--bad); }
    .dot.answered { background: var(--warn); }
    .nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .footer-note { margin: 20px 0 0; color: var(--muted); font-size: 13px; text-align: center; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
      .question-grid { grid-template-columns: repeat(10, minmax(32px, 1fr)); }
      .question-card { min-height: auto; }
    }
    @media (max-width: 560px) {
      .app { padding: 16px; }
      .topbar { flex-direction: column; gap: 12px; }
      .score-box { width: 100%; text-align: left; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; }
      .tab { padding: 8px 6px; }
      .question-grid { grid-template-columns: repeat(5, 1fr); }
      .actions .btn { flex: 1 1 auto; }
      .btn-ghost { margin-left: 0; }
      .nav-row .btn { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141b;
        --surface: #181e27;
        --surface-2: #202733;
        --text: #eef2f7;
        --muted: #aab4c2;
        --line: #36404d;
        --primary: #79a7db;
        --primary-2: #93b9e4;
        --primary-soft: #20354d;
        --good: #75d0a5;
        --good-soft: #18382d;
        --bad: #f19595;
        --bad-soft: #452424;
        --warn: #eac46d;
        --warn-soft: #43371f;
        --shadow: none;
      }
      .tab[aria-selected="true"], .btn-primary { color: #10213a; }
      .progress { background: #2f3844; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>宠物眼科麻醉互动题库</h1>
        <p class="subtitle">选择题与填空题自动判分，情景题可对照参考作答要点</p>
      </div>
      <div class="score-box" aria-live="polite">
        <strong id="scoreText">0 / 0</strong>
        <span>已判分正确数</span>
      </div>
    </header>

    <section class="progress-wrap" aria-label="答题进度">
      <div class="progress-meta"><span id="progressLabel">已作答 0 / 41</span><span id="progressPercent">0%</span></div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="41" aria-valuenow="0"><span id="progressBar"></span></div>
    </section>

    <nav class="tabs" aria-label="题型切换">
      <button class="tab" type="button" data-type="mcq" aria-selected="true">选择题 25</button>
      <button class="tab" type="button" data-type="fill" aria-selected="false">填空题 10</button>
      <button class="tab" type="button" data-type="scenario" aria-selected="false">情景题 6</button>
    </nav>

    <div class="layout">
      <section class="card question-card" aria-labelledby="questionTitle">
        <div class="question-meta">
          <span class="badge" id="typeBadge">选择题</span>
          <span class="question-count" id="questionCount"></span>
        </div>
        <h2 class="question-title" id="questionTitle"></h2>
        <div id="answerArea"></div>
        <div class="actions">
          <button class="btn btn-primary" type="button" id="checkBtn">提交答案</button>
          <button class="btn" type="button" id="explainBtn" aria-expanded="false">查看解析</button>
          <button class="btn btn-ghost" type="button" id="clearBtn">清除此题</button>
        </div>
        <div id="result" aria-live="polite"></div>
        <div id="explanation" hidden></div>
        <div class="nav-row">
          <button class="btn" type="button" id="prevBtn">上一题</button>
          <button class="btn" type="button" id="nextBtn">下一题</button>
        </div>
      </section>

      <aside class="card side" aria-label="答题卡">
        <div class="side-head">
          <h2>答题卡</h2>
          <button class="reset" type="button" id="resetBtn">重新开始</button>
        </div>
        <div class="question-grid" id="questionGrid"></div>
        <div class="legend" aria-label="答题状态说明">
          <span><i class="dot"></i>未作答</span>
          <span><i class="dot answered"></i>已填写</span>
          <span><i class="dot good"></i>正确</span>
          <span><i class="dot bad"></i>错误</span>
        </div>
      </aside>
    </div>
    <p class="footer-note">本题库用于考前练习，具体临床用药与处理以本院制度、药品说明书及负责兽医师指令为准。</p>
  </main>

  <script id="quiz-data" type="application/json">[{"id":"mcq-1","type":"mcq","number":1,"question":"关于维库溴铵，最准确的描述是","options":["能同时提供镇静和镇痛","能提供催眠但不能镇痛","只提供神经肌肉阻滞，不提供镇静或镇痛","可替代异氟烷维持麻醉"],"answer":"C","explanation":"维库溴铵只阻断神经肌肉传递。动物不能运动并不代表有意识消失或疼痛得到控制。"},{"id":"mcq-2","type":"mcq","number":2,"question":"布托啡诺在围术期应用时，最需要注意的是","options":["具有很强且持久的中重度疼痛控制","镇痛强度和持续时间有限，应按手术疼痛程度评估","会产生完整神经肌肉阻滞","不能与镇静药联合使用"],"answer":"B","explanation":"布托啡诺可用于镇痛和镇静辅助，但对较强手术疼痛的覆盖可能不足，必须结合手术类型和疼痛评估。"},{"id":"mcq-3","type":"mcq","number":3,"question":"动物使用右美托咪定后出现心率下降，首先应","options":["仅凭心率立即使用阿替美唑","先评估血压、脉搏质量、灌注、氧合和麻醉深度","立即停止所有监护","常规快速静推丙泊酚"],"answer":"B","explanation":"右美托咪定常使心率下降并增加血管阻力。是否干预不能只看心率，应同时看血压、节律、灌注和临床状态。"},{"id":"mcq-4","type":"mcq","number":4,"question":"阿替美唑的主要用途是","options":["拮抗右美托咪定的 α2 作用","拮抗维库溴铵","治疗吸入麻醉药过量","提供术后镇痛"],"answer":"A","explanation":"阿替美唑是 α2 肾上腺素能受体拮抗剂，主要用于逆转右美托咪定等 α2 激动剂的作用。"},{"id":"mcq-5","type":"mcq","number":5,"question":"关于丙泊酚，正确的是","options":["具有可靠的手术镇痛","常用于静脉诱导，需警惕呼吸抑制和低血压","不会引起呼吸暂停","给药速度不影响心肺抑制"],"answer":"B","explanation":"丙泊酚是常用静脉诱导药，不提供可靠镇痛，快速或大剂量给药可出现呼吸暂停和低血压。"},{"id":"mcq-6","type":"mcq","number":6,"question":"阿法沙龙用于诱导时，较合理的做法是","options":["一次快速推入全部预计量","缓慢分次给药并滴定至可插管深度","因有强镇痛可单独完成疼痛手术","只根据体重给固定量，不观察效果"],"answer":"B","explanation":"阿法沙龙应按效果缓慢滴定。一次快速给药会增加呼吸抑制风险，而且该药不替代镇痛。"},{"id":"mcq-7","type":"mcq","number":7,"question":"异氟烷浓度过高最常见的循环影响是","options":["剂量相关低血压","持续严重高血压","神经肌肉阻滞","完全消除眼心反射"],"answer":"A","explanation":"异氟烷可引起剂量相关的血管扩张、心血管抑制和低血压，也会抑制呼吸。"},{"id":"mcq-8","type":"mcq","number":8,"question":"麻醉前检查中，最不应省略的是","options":["只确认手术名称","确认患者身份、药物计划、氧源、回路、气道和急救设备","只检查异氟烷挥发罐","只测量体重"],"answer":"B","explanation":"麻醉安全依赖完整核查，包括身份、方案、氧源、回路、气道、监护和急救物品，而不是只检查单个设备。"},{"id":"mcq-9","type":"mcq","number":9,"question":"下列最可能使眼压升高的是","options":["平稳诱导并避免挣扎","充分氧合和通气","剧烈咳嗽或屏气","减少颈部压迫"],"answer":"C","explanation":"咳嗽、屏气和挣扎可增加胸内压、静脉压并造成眼压波动，眼球开放性损伤时尤其危险。"},{"id":"mcq-10","type":"mcq","number":10,"question":"眼心反射的典型传出通路主要通过","options":["交感神经","迷走神经","膈神经","坐骨神经"],"answer":"B","explanation":"眼心反射由眼眶或眼外肌刺激引起，传入与三叉神经相关，传出主要经迷走神经，表现为心动过缓或心律失常。"},{"id":"mcq-11","type":"mcq","number":11,"question":"眼球牵拉时心率突然明显下降，第一步最合适的是","options":["请术者暂停牵拉或压迫并立即评估患者","继续操作等待自行恢复","马上拔除气管导管","先关闭所有监护报警"],"answer":"A","explanation":"暂停牵拉可立即去除诱因。随后应同步评估氧合、通气、麻醉深度和循环，并按严重程度处理。"},{"id":"mcq-12","type":"mcq","number":12,"question":"呼气末二氧化碳持续升高最常提示","options":["通气不足或二氧化碳排出受限","必然存在低血糖","神经肌肉功能已经完全恢复","血压一定升高"],"answer":"A","explanation":"EtCO2 持续升高通常提示肺泡通气不足、回路问题或二氧化碳再吸入，应结合波形和设备检查定位原因。"},{"id":"mcq-13","type":"mcq","number":13,"question":"SpO2 突然下降时，最合适的处理原则是","options":["先确认波形和探头，同时立即检查氧源、气道与通气","等待五分钟再复测","只增加异氟烷","停止记录以免干扰操作"],"answer":"A","explanation":"先确认数值是否可靠，同时立即检查氧源、气管导管、回路和通气，避免把真实低氧误当探头故障而延误。"},{"id":"mcq-14","type":"mcq","number":14,"question":"出现低血压时，下列哪项处理思路最合理","options":["立即盲目使用阿替美唑","评估麻醉深度、心率、通气和容量状态，按原因降低吸入药或采取循环支持","继续提高异氟烷","只观察体温，不处理循环"],"answer":"B","explanation":"低血压处理应针对原因。常见步骤是评估麻醉深度和吸入药浓度、心率节律、通气、体温和容量状态，再给予相应支持。"},{"id":"mcq-15","type":"mcq","number":15,"question":"右美托咪定相关心动过缓是否需要拮抗，主要依据是","options":["心率数字是否低于固定值","血压、组织灌注、节律、麻醉需求及整体临床状态","手术医生是否喜欢较快心率","动物体重是否超过十千克"],"answer":"B","explanation":"α2 激动剂相关心动过缓可能伴随血压正常或升高。是否拮抗取决于灌注、节律、手术阶段和整体风险。"},{"id":"mcq-16","type":"mcq","number":16,"question":"开放性眼球损伤患者的麻醉重点之一是","options":["允许动物在诱导期剧烈挣扎","尽量使诱导、插管和苏醒平稳，避免咳嗽和眼压波动","常规压迫眼球确认疼痛","维持明显高碳酸血症"],"answer":"B","explanation":"开放性眼损伤应尽量避免眼压突然升高。平稳诱导、可靠气道、合适通气和安静苏醒都是关键。"},{"id":"mcq-17","type":"mcq","number":17,"question":"使用维库溴铵前必须具备的条件是","options":["可靠气道、机械通气能力、持续麻醉和监护","动物能够自由活动","停止全部镇痛药","不需要氧源"],"answer":"A","explanation":"肌松会导致呼吸肌无力或麻痹，因此必须先建立气道并确保机械通气、氧合、麻醉与监护均可持续。"},{"id":"mcq-18","type":"mcq","number":18,"question":"TOF 监测主要用于","options":["测量眼压","评估神经肌肉阻滞及恢复程度","测量吸入麻醉浓度","诊断低血糖"],"answer":"B","explanation":"TOF 通过周围神经刺激观察肌肉反应，用于判断神经肌肉阻滞深度和恢复趋势。"},{"id":"mcq-19","type":"mcq","number":19,"question":"肌松患者拔管前最重要的条件是","options":["手术已经结束","已关闭异氟烷一分钟","神经肌肉功能充分恢复，通气与保护性反射适当","心率高于术前值"],"answer":"C","explanation":"手术结束不等于肌松消失。必须确认神经肌肉功能、通气、意识和保护性反射达到安全标准后再拔管。"},{"id":"mcq-20","type":"mcq","number":20,"question":"短头犬苏醒期的主要风险是","options":["上气道阻塞","眼压必然过低","维库溴铵失效过快","血糖必然升高"],"answer":"A","explanation":"短头犬存在解剖性上气道狭窄，苏醒和拔管后更易发生阻塞，因此通常需要充分清醒并加强观察。"},{"id":"mcq-21","type":"mcq","number":21,"question":"药液体积换算的正确公式是","options":["体重除以浓度再除以剂量","体重乘目标剂量再除以药液浓度","药液浓度乘体重除以目标剂量","目标剂量除以体重乘浓度"],"answer":"B","explanation":"先计算所需药物质量，再除以药液浓度：体重乘目标剂量除以浓度。实际诱导仍应结合效果滴定。"},{"id":"mcq-22","type":"mcq","number":22,"question":"动物自主呼吸浅慢且 EtCO2 持续升高，首先应","options":["评估气道和回路并辅助或控制通气","提高异氟烷浓度","停止供氧","立即拔管"],"answer":"A","explanation":"浅慢呼吸合并 EtCO2 升高提示通气不足。应先排查气道和回路，再立即提供辅助或控制通气。"},{"id":"mcq-23","type":"mcq","number":23,"question":"使用维库溴铵后动物完全不动，关于麻醉深度的判断正确的是","options":["不动证明麻醉和镇痛充分","肌松掩盖体动，需依靠麻醉计划、生命体征和监护综合判断","可以停止异氟烷","可以停止镇痛"],"answer":"B","explanation":"肌松会消除体动这一麻醉深度线索，因此必须根据用药计划、血压、心率、呼吸及其他监护综合判断。"},{"id":"mcq-24","type":"mcq","number":24,"question":"围术期低体温最可能导致","options":["药物代谢和苏醒延迟","所有麻醉药迅速失效","血压监测无需继续","呼气末二氧化碳必然为零"],"answer":"A","explanation":"低体温可减慢药物代谢和清除、延长苏醒，并增加凝血和心血管问题，因此预防性保温很重要。"},{"id":"mcq-25","type":"mcq","number":25,"question":"完整麻醉记录最重要的价值是","options":["只用于统计手术数量","连续呈现用药、生命体征、事件和处理，支持安全交接与复盘","替代现场监护","只记录术前体重即可"],"answer":"B","explanation":"麻醉记录可显示趋势和事件时间线，便于交接、判断治疗反应、质量改进及医疗记录追溯。"},{"id":"fill-1","type":"fill","number":1,"question":"麻醉风险常用 ______ 分级表示。","answer":"ASA","explanation":"ASA 分级用于概括患者术前全身状态和麻醉风险，但不能替代完整评估。","accepted":["asa","asa分级"]},{"id":"fill-2","type":"fill","number":2,"question":"药液体积 mL ＝ 体重 kg × 目标剂量 mg/kg ÷ ______ mg/mL。","answer":"药液浓度","explanation":"单位应统一为 mg、kg 和 mL，计算后还要复核药品名称、浓度和最大允许量。","accepted":["药液浓度","浓度"]},{"id":"fill-3","type":"fill","number":3,"question":"眼心反射的传入主要与三叉神经有关，传出主要经 ______ 神经。","answer":"迷走","explanation":"眼心反射的传入与三叉神经相关，传出主要经迷走神经影响心率和节律。","accepted":["迷走","迷走神经"]},{"id":"fill-4","type":"fill","number":4,"question":"阿替美唑主要用于拮抗 ______ 的作用。","answer":"右美托咪定","explanation":"阿替美唑拮抗 α2 激动剂作用，同时可能使镇静和部分镇痛迅速减弱。","accepted":["右美托咪定","右美","dexmedetomidine"]},{"id":"fill-5","type":"fill","number":5,"question":"反映通气状态并可观察呼吸波形的常用监测是 ______。","answer":"呼气末二氧化碳监测或二氧化碳波形监测","explanation":"数值反映通气趋势，波形还能帮助发现回路脱落、再吸入和气道问题。","accepted":["呼气末二氧化碳监测","二氧化碳波形监测","二氧化碳监测","etco2","capnography"]},{"id":"fill-6","type":"fill","number":6,"question":"评估维库溴铵神经肌肉阻滞和恢复程度可使用 ______ 监测。","answer":"TOF","explanation":"TOF 应结合临床恢复情况使用，不能只凭动物开始呼吸就认为阻滞完全消失。","accepted":["tof","tof监测","四个成串刺激","四个成串刺激监测"]},{"id":"fill-7","type":"fill","number":7,"question":"SpO2 主要反映血红蛋白的 ______ 饱和度。","answer":"氧","explanation":"SpO2 是外周脉搏血氧饱和度，需要结合波形、灌注和临床表现判断。","accepted":["氧","血氧"]},{"id":"fill-8","type":"fill","number":8,"question":"丙泊酚和阿法沙龙均不能提供可靠的手术 ______。","answer":"镇痛","explanation":"诱导药使意识消失，但并不等于手术伤害性刺激已被充分控制。","accepted":["镇痛"]},{"id":"fill-9","type":"fill","number":9,"question":"咳嗽、屏气、挣扎、低氧和高碳酸血症均可能使 ______ 升高。","answer":"眼压","explanation":"眼科麻醉应减少咳嗽、挣扎、低氧和高碳酸血症，避免眼压剧烈波动。","accepted":["眼压","眼内压"]},{"id":"fill-10","type":"fill","number":10,"question":"肌松药不能替代镇静、催眠和 ______。","answer":"镇痛","explanation":"肌松仅影响运动功能，持续麻醉和镇痛必须独立保证。","accepted":["镇痛"]},{"id":"scenario-1","type":"scenario","number":1,"title":"情景一 常规眼科手术方案","question":"一只一般状况良好的成年犬拟行择期眼科手术。请写出从术前评估到苏醒的麻醉管理框架，并说明眼科麻醉中需要特别关注的三项问题。","answerPoints":["术前核对身份、手术侧、禁食情况、既往用药和过敏史；完成体格检查、气道评估、ASA 分级及必要检查。","根据疼痛程度和患者状态选择镇静与镇痛，预氧合后建立静脉通路，准备合适导管、回路和急救物品。","用丙泊酚或阿法沙龙缓慢滴定诱导，轻柔插管并固定，避免咳嗽和挣扎。","用异氟烷维持，连续监测心率、节律、血压、SpO2、EtCO2、体温和麻醉深度；必要时机械通气。","眼科重点是控制眼压波动、预防和识别眼心反射、保证完全制动且不能忽视镇痛。","提前制定苏醒计划，保温、持续供氧，确认通气和气道保护能力后拔管；短头动物加强气道观察。"],"explanation":"情景题按识别主要危险、立即处理、进一步评估和预防复发的顺序作答。"},{"id":"scenario-2","type":"scenario","number":2,"title":"情景二 右美托咪定后心动过缓","question":"犬麻醉前使用右美托咪定后心率明显下降，但无创血压偏高，脉搏可触及，黏膜颜色尚可。请说明你如何判断和处理，以及何时考虑使用阿替美唑。","answerPoints":["先确认心电和脉搏是否一致，检查血压趋势、脉搏质量、黏膜颜色、毛细血管再充盈、SpO2 和体温。","血压偏高且灌注尚可时，心动过缓可能与外周血管收缩和压力反射有关，不应只凭心率数字立即拮抗。","减少额外心肺抑制，保持氧合和通气，持续观察节律与灌注；同时确认不存在眼球牵拉、缺氧或麻醉过深。","若出现低血压、灌注恶化、严重心律失常、持续临床不稳定，或需要迅速逆转镇静，应按负责兽医师和院内方案考虑阿替美唑。","拮抗后需继续监测，因为镇静和镇痛会减弱，动物可能快速清醒或躁动。"],"explanation":"情景题按识别主要危险、立即处理、进一步评估和预防复发的顺序作答。"},{"id":"scenario-3","type":"scenario","number":3,"title":"情景三 眼球牵拉时突发心动过缓","question":"术中牵拉眼外肌时，心率由每分钟 110 次迅速降至 45 次，并出现节律异常。请写出最可能的原因、立即处理顺序和后续预防措施。","answerPoints":["最可能为眼心反射，即眼球或眼外肌刺激通过三叉神经和迷走神经引起心动过缓或心律失常。","立即请术者停止牵拉或压迫，报告异常并记录时间。","同时检查脉搏、心电、血压、SpO2、EtCO2、气道和通气，给予充分氧合，纠正低氧或高碳酸血症。","评估麻醉深度和镇痛，必要时按负责兽医师指令加深麻醉或加强镇痛。","若停止刺激后仍严重心动过缓、低血压或灌注不良，按院内急救流程使用相应药物并准备心肺复苏。","再次操作前与术者沟通，减少突然和持续牵拉，并保持稳定麻醉深度与通气。"],"explanation":"情景题按识别主要危险、立即处理、进一步评估和预防复发的顺序作答。"},{"id":"scenario-4","type":"scenario","number":4,"title":"情景四 高碳酸血症并低氧","question":"全麻动物 EtCO2 逐渐升至 60 mmHg，SpO2 从 99% 降至 91%，胸廓起伏变浅。请按优先顺序列出检查和处理步骤。","answerPoints":["立即提高警惕并保证氧供，观察患者而不是只看监护屏幕；确认胸廓运动、黏膜颜色和脉搏。","检查氧源、流量、回路连接、储气囊、阀门和二氧化碳吸收装置，确认没有脱落、阻塞或再吸入。","检查气管导管位置、扭折、黏液堵塞、气囊漏气及是否意外进入单侧支气管；必要时吸引或重新插管。","开始或加强辅助或控制通气，并根据患者情况调整通气参数，使 EtCO2 逐步回到目标范围。","评估麻醉深度和药物影响，避免吸入麻醉过深；持续观察 SpO2、EtCO2 波形、血压和心率对处理的反应。","若仍不改善，考虑肺部疾病、设备故障或循环灌注问题，并按急救流程升级处理。"],"explanation":"情景题按识别主要危险、立即处理、进一步评估和预防复发的顺序作答。"},{"id":"scenario-5","type":"scenario","number":5,"title":"情景五 使用维库溴铵后呼吸未恢复","question":"眼科显微手术结束，异氟烷已降低，但动物仍无有效自主呼吸，TOF 提示明显残余阻滞。请说明此时不能做什么、必须继续做什么，以及安全拔管需要满足哪些条件。","answerPoints":["不能因手术结束就拔管，也不能因动物不动而停止麻醉或镇痛。","继续供氧、气管插管、机械通气、保温和完整监护，并维持足够的催眠和镇痛，防止清醒但无法运动。","复核维库溴铵给药时间和总量，评估体温、酸碱与电解质状态及可能延长阻滞的药物因素。","持续 TOF 监测；如医院具备拮抗方案，应由负责兽医师按指征实施并观察反应。","安全拔管前应确认神经肌肉功能充分恢复、自主通气有效、EtCO2 和 SpO2 可接受、意识和保护性反射适当、上气道通畅。"],"explanation":"情景题按识别主要危险、立即处理、进一步评估和预防复发的顺序作答。"},{"id":"scenario-6","type":"scenario","number":6,"title":"情景六 开放性眼损伤与短头犬","question":"一只短头犬因开放性眼球损伤急诊手术，动物疼痛、焦躁并有上气道杂音。请指出主要麻醉风险，并给出诱导、气道、维持和苏醒阶段的管理重点。","answerPoints":["主要风险包括眼压升高导致眼内容物进一步脱出、疼痛和应激、困难气道、诱导或苏醒期上气道阻塞，以及饱胃或急诊相关误吸风险。","尽量减少保定和眼球压迫，先提供氧合并准备多规格气管导管、喉镜、吸引和困难气道备用方案。","在可靠静脉通路和完整准备后平稳诱导，迅速而轻柔地建立气道，避免长时间屏气、低氧、咳嗽和挣扎。","维持阶段控制通气，避免高碳酸血症；持续监测循环、氧合、通气、体温和眼心反射，保证镇痛与足够麻醉深度。","苏醒时保持安静和保温，短头犬通常需在能够维持上气道和具备充分保护性反射后拔管，并准备立即处理阻塞或再插管。"],"explanation":"情景题按识别主要危险、立即处理、进一步评估和预防复发的顺序作答。"}]</script>
  <script>
    (() => {
      const questions = JSON.parse(document.getElementById('quiz-data').textContent);
      const storageKey = 'petOphthalmicAnesthesiaQuizV1';
      const typeNames = { mcq: '选择题', fill: '填空题', scenario: '情景题' };
      const state = loadState();
      let currentType = state.currentType || 'mcq';
      let currentIndex = Number.isInteger(state.currentIndex?.[currentType]) ? state.currentIndex[currentType] : 0;

      const els = {
        tabs: [...document.querySelectorAll('.tab')],
        typeBadge: document.getElementById('typeBadge'),
        questionCount: document.getElementById('questionCount'),
        questionTitle: document.getElementById('questionTitle'),
        answerArea: document.getElementById('answerArea'),
        checkBtn: document.getElementById('checkBtn'),
        explainBtn: document.getElementById('explainBtn'),
        clearBtn: document.getElementById('clearBtn'),
        result: document.getElementById('result'),
        explanation: document.getElementById('explanation'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        questionGrid: document.getElementById('questionGrid'),
        resetBtn: document.getElementById('resetBtn'),
        scoreText: document.getElementById('scoreText'),
        progressLabel: document.getElementById('progressLabel'),
        progressPercent: document.getElementById('progressPercent'),
        progressBar: document.getElementById('progressBar'),
        progress: document.querySelector('.progress')
      };

      function blankState() {
        return { answers: {}, grades: {}, explanations: {}, currentType: 'mcq', currentIndex: { mcq: 0, fill: 0, scenario: 0 } };
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          return { ...blankState(), ...saved, currentIndex: { ...blankState().currentIndex, ...(saved?.currentIndex || {}) } };
        } catch (_) {
          return blankState();
        }
      }

      function saveState() {
        state.currentType = currentType;
        state.currentIndex[currentType] = currentIndex;
        localStorage.setItem(storageKey, JSON.stringify(state));
      }

      function listForType(type = currentType) {
        return questions.filter(q => q.type === type);
      }

      function currentQuestion() {
        return listForType()[currentIndex];
      }

      function normalize(value) {
        return String(value || '')
          .trim()
          .toLowerCase()
          .replace(/[\s　]+/g, '')
          .replace(/[，。、“”‘’：:；;（）()\-_/]/g, '');
      }

      function hasAnswer(question) {
        const value = state.answers[question.id];
        return typeof value === 'string' && value.trim().length > 0;
      }

      function render() {
        const list = listForType();
        currentIndex = Math.max(0, Math.min(currentIndex, list.length - 1));
        const q = currentQuestion();
        els.tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.type === currentType)));
        els.typeBadge.textContent = typeNames[q.type];
        els.questionCount.textContent = `第 ${currentIndex + 1} 题，共 ${list.length} 题`;
        els.questionTitle.textContent = q.title ? `${q.title}  ${q.question}` : q.question;
        els.answerArea.replaceChildren(buildAnswerControl(q));
        renderResult(q);
        renderExplanation(q);
        renderGrid();
        renderStats();
        els.checkBtn.textContent = q.type === 'scenario' ? '保存作答' : '提交答案';
        els.prevBtn.disabled = currentIndex === 0;
        els.nextBtn.disabled = currentIndex === list.length - 1;
        saveState();
      }

      function buildAnswerControl(q) {
        const wrapper = document.createElement('div');
        if (q.type === 'mcq') {
          wrapper.className = 'options';
          q.options.forEach((text, index) => {
            const letter = String.fromCharCode(65 + index);
            const label = document.createElement('label');
            label.className = 'option';
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'mcq-answer';
            input.value = letter;
            input.checked = state.answers[q.id] === letter;
            input.addEventListener('change', () => {
              state.answers[q.id] = letter;
              delete state.grades[q.id];
              saveState();
              renderGrid();
              renderStats();
              renderResult(q);
            });
            const letterSpan = document.createElement('span');
            letterSpan.className = 'option-letter';
            letterSpan.textContent = `${letter}.`;
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            label.append(input, letterSpan, textSpan);
            wrapper.append(label);
          });
        } else if (q.type === 'fill') {
          const label = document.createElement('label');
          label.className = 'answer-label';
          label.htmlFor = 'fillAnswer';
          label.textContent = '填写答案';
          const input = document.createElement('input');
          input.id = 'fillAnswer';
          input.className = 'answer-input';
          input.autocomplete = 'off';
          input.placeholder = '请输入答案';
          input.value = state.answers[q.id] || '';
          input.addEventListener('input', () => {
            state.answers[q.id] = input.value;
            delete state.grades[q.id];
            saveState();
            renderGrid();
            renderStats();
            renderResult(q);
          });
          input.addEventListener('keydown', event => {
            if (event.key === 'Enter') gradeCurrent();
          });
          wrapper.append(label, input);
        } else {
          const label = document.createElement('label');
          label.className = 'answer-label';
          label.htmlFor = 'scenarioAnswer';
          label.textContent = '写下你的处理思路';
          const textarea = document.createElement('textarea');
          textarea.id = 'scenarioAnswer';
          textarea.className = 'scenario-input';
          textarea.placeholder = '建议按识别问题、立即处理、进一步评估、预防复发的顺序作答';
          textarea.value = state.answers[q.id] || '';
          textarea.addEventListener('input', () => {
            state.answers[q.id] = textarea.value;
            delete state.grades[q.id];
            saveState();
            renderGrid();
            renderStats();
            renderResult(q);
          });
          wrapper.append(label, textarea);
        }
        return wrapper;
      }

      function gradeCurrent() {
        const q = currentQuestion();
        if (!hasAnswer(q)) {
          els.result.innerHTML = '<div class="result wrong" role="alert">请先填写答案。</div>';
          return;
        }
        if (q.type === 'scenario') {
          state.grades[q.id] = 'saved';
        } else if (q.type === 'mcq') {
          state.grades[q.id] = state.answers[q.id] === q.answer ? 'correct' : 'wrong';
        } else {
          const user = normalize(state.answers[q.id]);
          state.grades[q.id] = q.accepted.some(answer => normalize(answer) === user) ? 'correct' : 'wrong';
        }
        saveState();
        renderResult(q);
        renderGrid();
        renderStats();
      }

      function renderResult(q) {
        const grade = state.grades[q.id];
        els.result.replaceChildren();
        if (!grade) return;
        const div = document.createElement('div');
        div.className = `result ${grade}`;
        if (grade === 'correct') div.textContent = '回答正确';
        if (grade === 'wrong') div.textContent = `回答错误。正确答案：${q.answer}`;
        if (grade === 'saved') div.textContent = '作答已保存，可点击“查看解析”对照参考要点。';
        els.result.append(div);
      }

      function renderExplanation(q) {
        const isOpen = Boolean(state.explanations[q.id]);
        els.explainBtn.setAttribute('aria-expanded', String(isOpen));
        els.explainBtn.textContent = isOpen ? '收起解析' : '查看解析';
        els.explanation.hidden = !isOpen;
        els.explanation.replaceChildren();
        if (!isOpen) return;
        const box = document.createElement('div');
        box.className = 'explanation';
        const heading = document.createElement('h3');
        heading.textContent = q.type === 'scenario' ? '参考作答要点' : '答案与解析';
        box.append(heading);
        if (q.type === 'scenario') {
          const intro = document.createElement('p');
          intro.textContent = q.explanation;
          const list = document.createElement('ul');
          q.answerPoints.forEach(point => {
            const li = document.createElement('li');
            li.textContent = point;
            list.append(li);
          });
          box.append(intro, list);
        } else {
          const answer = document.createElement('p');
          const strong = document.createElement('strong');
          strong.textContent = `正确答案：${q.answer}。`;
          answer.append(strong, document.createTextNode(q.explanation));
          box.append(answer);
        }
        els.explanation.append(box);
      }

      function renderGrid() {
        const list = listForType();
        els.questionGrid.replaceChildren();
        list.forEach((q, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'q-jump';
          button.textContent = String(index + 1);
          button.setAttribute('aria-label', `第 ${index + 1} 题`);
          const grade = state.grades[q.id];
          if (grade) button.classList.add(grade);
          else if (hasAnswer(q)) button.classList.add('answered');
          if (index === currentIndex) {
            button.classList.add('current');
            button.setAttribute('aria-current', 'true');
          }
          button.addEventListener('click', () => {
            currentIndex = index;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          els.questionGrid.append(button);
        });
      }

      function renderStats() {
        const answered = questions.filter(hasAnswer).length;
        const graded = questions.filter(q => q.type !== 'scenario' && state.grades[q.id]).length;
        const correct = questions.filter(q => state.grades[q.id] === 'correct').length;
        const percent = Math.round(answered / questions.length * 100);
        els.scoreText.textContent = `${correct} / ${graded}`;
        els.progressLabel.textContent = `已作答 ${answered} / ${questions.length}`;
        els.progressPercent.textContent = `${percent}%`;
        els.progressBar.style.width = `${percent}%`;
        els.progress.setAttribute('aria-valuenow', String(answered));
      }

      els.tabs.forEach(tab => tab.addEventListener('click', () => {
        state.currentIndex[currentType] = currentIndex;
        currentType = tab.dataset.type;
        currentIndex = state.currentIndex[currentType] || 0;
        render();
      }));
      els.checkBtn.addEventListener('click', gradeCurrent);
      els.explainBtn.addEventListener('click', () => {
        const q = currentQuestion();
        state.explanations[q.id] = !state.explanations[q.id];
        saveState();
        renderExplanation(q);
      });
      els.clearBtn.addEventListener('click', () => {
        const q = currentQuestion();
        delete state.answers[q.id];
        delete state.grades[q.id];
        delete state.explanations[q.id];
        saveState();
        render();
      });
      els.prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex -= 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });
      els.nextBtn.addEventListener('click', () => {
        if (currentIndex < listForType().length - 1) { currentIndex += 1; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });
      els.resetBtn.addEventListener('click', () => {
        if (!confirm('确定清空全部答题记录并重新开始吗？')) return;
        localStorage.removeItem(storageKey);
        Object.assign(state, blankState());
        currentType = 'mcq';
        currentIndex = 0;
        render();
      });
      document.addEventListener('keydown', event => {
        if (event.target.matches('input, textarea')) return;
        if (event.key === 'ArrowLeft' && currentIndex > 0) { currentIndex -= 1; render(); }
        if (event.key === 'ArrowRight' && currentIndex < listForType().length - 1) { currentIndex += 1; render(); }
      });

      render();
    })();
  </script>
</body>
</html>
